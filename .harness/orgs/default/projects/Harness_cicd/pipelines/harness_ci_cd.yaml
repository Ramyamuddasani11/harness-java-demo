pipeline:
  stages:
    - id: Build
      name: Build
      clone:
        enabled: true
        ref:
          type: branch
          name: main
        repo: Ramyamuddasani11/harness-java-demo
        connector: second_connector
      cache:
        enabled: true
      steps:
        - id: Maven_build
          name: Maven build
          run:
            shell: bash
            script: mvn clean package
            container:
              image: maven:3.9.6-eclipse-temurin-17
        - name: Run test
          run-test:
            shell: bash
            script: mvn test
            intelligence: { disabled: false }
            container:
              image: maven:3.9.6-eclipse-temurin-17
          id: Run_test
        - name: Package artifact
          run:
            shell: bash
            script: mvn package
            container:
              image: maven:3.9.6-eclipse-temurin-17
          id: Package_artifact
        - name: Verify artifact
          run:
            shell: bash
            script: "echo \"Artifacts generated\"\r

              ls -la target"
            container:
              image: maven:3.9.6-eclipse-temurin-17
          id: Verify_artifact
      platform:
        os: linux
        arch: amd64
    - name: Deploy_Dev
      id: Deploy_Dev
      steps:
        - name: Deploy-application
          run:
            shell: bash
            script: "echo \"=================================\"\r

              echo \"DEPLOYING APPLICATION TO DEV\"\r

              echo \"=================================\"\r

              echo \"Application deployment started\"\r

              echo \"Artifact received successfully\"\r

              echo \"Application deployed to DEV\"\r

              echo \"=================================\"\r

              exit 0"
          id: Deploy_application
    - name: QA-approval
      id: QA_approval
      steps:
        - name: QA-approval
          approval:
            with:
              message: Approve deployment to QA environment
              execution-details: true
              auto-reject: false
              user-groups:
                - ramya
              approvers-min-count: 1
              block-executor: false
              auto-approve: false
              inputs: {}
            uses: harness
          id: QA_approval
    - name: Deploy-QA
      id: Deploy_QA
      steps:
        - name: Deploy_QA
          run:
            shell: bash
            script: "echo \"=================================\"\r

              echo \"DEPLOYING TO QA\"\r

              echo \"=================================\"\r

              \r

              echo \"Application deployed successfully\"\r

              \r

              echo \"=================================\""
          id: Deploy_QA
    - name: QA-validation
      id: QA_validation
      steps:
        - name: QA-validation
          run:
            shell: bash
            script: "echo \"Running QA validation\"\r

              echo \"Health check passed\""
          id: QA_validation
